<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administrar Menú</title>
<style>
  body { font-family: sans-serif; max-width: 800px; margin: 30px auto; }
  #galeria { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  .item { position: relative; width: 150px; cursor: grab; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; }
  .item img { width: 100%; height: 150px; object-fit: cover; display: block; }
  .item button {
    position: absolute; top: 4px; right: 4px;
    background: #e53935; color: white; border: none;
    border-radius: 4px; padding: 4px 8px; cursor: pointer;
  }
  .sortable-ghost { opacity: 0.4; }
</style>
</head>
<body>
  <h1>Administrar imágenes del menú</h1>

  <form id="uploadForm">
    <input type="file" id="fileInput" name="images" accept="image/*" multiple required>
    <button type="submit">Subir imágenes</button>
  </form>

  <p>Arrastrá las miniaturas para cambiar el orden en que aparecen en el menú.</p>
  <div id="galeria"></div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    const galeria = document.getElementById("galeria");
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");

    async function cargarImagenes() {
      const res = await fetch("/api/menu/images");
      const imagenes = await res.json();
      galeria.innerHTML = "";
      imagenes.forEach((img) => {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.filename = img.filename;
        div.innerHTML = `
          <img src="${img.url}" alt="">
          <button onclick="borrarImagen('${img.filename}')">✕</button>
        `;
        galeria.appendChild(div);
      });
    }

    async function borrarImagen(filename) {
      if (!confirm("¿Borrar esta imagen?")) return;
      await fetch("/api/menu/images/" + filename, { method: "DELETE" });
      cargarImagenes();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData();
      for (const file of fileInput.files) data.append("images", file);
      await fetch("/api/menu/upload", { method: "POST", body: data });
      fileInput.value = "";
      cargarImagenes();
    });

    new Sortable(galeria, {
      animation: 150,
      onEnd: async () => {
        const order = [...galeria.children].map((el) => el.dataset.filename);
        await fetch("/api/menu/images/order", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order }),
        });
      },
    });

    cargarImagenes();
  </script>
</body>
</html>
